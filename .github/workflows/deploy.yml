name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: atradias-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify VPS auto deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wait for VPS pull timer
        run: |
          echo "The VPS runs atradias-auto-deploy.timer and checks GitHub every minute."
          echo "Waiting for the server-side deployment to pick up this commit..."
          sleep 75

      - name: Verify live health endpoint
        run: |
          python3 - <<PY
          import json
          import time
          import urllib.request

          url = "https://atradias.duckdns.org/api/health"
          last_error = None

          for attempt in range(1, 13):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      body = response.read().decode("utf-8")
                      if response.status != 200:
                          raise RuntimeError(f"HTTP {response.status}: {body[:300]}")
                      data = json.loads(body)
                      if data.get("status") != "ready":
                          raise RuntimeError(f"health status is not ready: {data!r}")
                      print("Live deployment is ready:")
                      print(json.dumps(data, indent=2))
                      raise SystemExit(0)
              except Exception as exc:
                  last_error = exc
                  print(f"Attempt {attempt}/12 failed: {exc}")
                  time.sleep(10)

          raise SystemExit(f"Live deployment did not become ready: {last_error}")
          PY
